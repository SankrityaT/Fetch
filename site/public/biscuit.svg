<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Biscuit, the Fetch retriever. Built from circles + rounded rects so he
       survives 16px. Palette is locked to the brand gold ramp. -->
  <defs>
    <linearGradient id="b-coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7BB5C"/><stop offset="1" stop-color="#E39A2C"/>
    </linearGradient>
  </defs>

  <symbol id="biscuit-mark" viewBox="0 0 64 64">
    <g>
      <!-- ears -->
      <ellipse cx="13.5" cy="36" rx="7.5" ry="13" fill="#C97F1E"/>
      <ellipse cx="50.5" cy="36" rx="7.5" ry="13" fill="#C97F1E"/>
      <!-- head -->
      <ellipse cx="32" cy="32" rx="20" ry="18.5" fill="url(#b-coat)"/>
      <!-- brow blaze -->
      <ellipse cx="32" cy="24" rx="7" ry="5.5" fill="#FFE0AE" opacity=".55"/>
      <!-- muzzle -->
      <ellipse cx="32" cy="41.5" rx="12" ry="8.5" fill="#FFE9C9"/>
      <!-- nose -->
      <ellipse cx="32" cy="37" rx="4.2" ry="3.2" fill="#2A211B"/>
      <path d="M32 40.2v3.4" stroke="#2A211B" stroke-width="1.8" stroke-linecap="round"/>
      <!-- eyes -->
      <circle cx="23.5" cy="29.5" r="2.9" fill="#2A211B"/>
      <circle cx="40.5" cy="29.5" r="2.9" fill="#2A211B"/>
      <circle cx="24.5" cy="28.5" r="1" fill="#fff"/>
      <circle cx="41.5" cy="28.5" r="1" fill="#fff"/>
    </g>
  </symbol>

  <symbol id="biscuit-idle" viewBox="0 0 64 64">
    <g>
      <ellipse cx="13.5" cy="33" rx="7.5" ry="12.5" fill="#C97F1E"/>
      <ellipse cx="50.5" cy="33" rx="7.5" ry="12.5" fill="#C97F1E"/>
      <ellipse cx="32" cy="32" rx="20" ry="18.5" fill="url(#b-coat)"/>
      <ellipse cx="32" cy="24" rx="7" ry="5.5" fill="#FFE0AE" opacity=".55"/>
      <ellipse cx="32" cy="41.5" rx="12" ry="8.5" fill="#FFE9C9"/>
      <ellipse cx="32" cy="37" rx="4.2" ry="3.2" fill="#2A211B"/>
      <path d="M32 40.2v3" stroke="#2A211B" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M28.4 44.6a4.2 3.4 0 0 0 7.2 0" fill="none" stroke="#2A211B" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="23.5" cy="29.5" r="2.9" fill="#2A211B"/>
      <circle cx="40.5" cy="29.5" r="2.9" fill="#2A211B"/>
      <circle cx="24.5" cy="28.5" r="1" fill="#fff"/>
      <circle cx="41.5" cy="28.5" r="1" fill="#fff"/>
    </g>
  </symbol>

  <!-- recording: ears swept back, tongue out, eyes bright -->
  <symbol id="biscuit-record" viewBox="0 0 64 64">
    <g>
      <ellipse cx="12" cy="40" rx="7" ry="12" fill="#C97F1E" transform="rotate(24 12 40)"/>
      <ellipse cx="52" cy="40" rx="7" ry="12" fill="#C97F1E" transform="rotate(-24 52 40)"/>
      <ellipse cx="32" cy="32" rx="20" ry="18.5" fill="url(#b-coat)"/>
      <ellipse cx="32" cy="24" rx="7" ry="5.5" fill="#FFE0AE" opacity=".55"/>
      <ellipse cx="32" cy="41.5" rx="12" ry="8.5" fill="#FFE9C9"/>
      <!-- tongue -->
      <path d="M28.5 45h7a3.5 3.5 0 0 1-3.5 6.5A3.5 3.5 0 0 1 28.5 45Z" fill="#FF8A8A"/>
      <ellipse cx="32" cy="37" rx="4.2" ry="3.2" fill="#2A211B"/>
      <path d="M32 40.2v2.6" stroke="#2A211B" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="23.5" cy="29" r="3.2" fill="#2A211B"/>
      <circle cx="40.5" cy="29" r="3.2" fill="#2A211B"/>
      <circle cx="24.7" cy="27.8" r="1.2" fill="#fff"/>
      <circle cx="41.7" cy="27.8" r="1.2" fill="#fff"/>
    </g>
  </symbol>

  <!-- thinking: whole head tilted, eyes up -->
  <symbol id="biscuit-think" viewBox="0 0 64 64">
    <g transform="rotate(-13 32 34)">
      <ellipse cx="13.5" cy="34" rx="7.5" ry="12.5" fill="#C97F1E"/>
      <ellipse cx="50.5" cy="34" rx="7.5" ry="12.5" fill="#C97F1E"/>
      <ellipse cx="32" cy="32" rx="20" ry="18.5" fill="url(#b-coat)"/>
      <ellipse cx="32" cy="24" rx="7" ry="5.5" fill="#FFE0AE" opacity=".55"/>
      <ellipse cx="32" cy="41.5" rx="12" ry="8.5" fill="#FFE9C9"/>
      <ellipse cx="32" cy="37" rx="4.2" ry="3.2" fill="#2A211B"/>
      <path d="M29.5 44.5h5" stroke="#2A211B" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="23.5" cy="28.5" r="2.9" fill="#2A211B"/>
      <circle cx="40.5" cy="28.5" r="2.9" fill="#2A211B"/>
      <circle cx="24.8" cy="27.3" r="1.1" fill="#fff"/>
      <circle cx="41.8" cy="27.3" r="1.1" fill="#fff"/>
    </g>
  </symbol>

  <!-- done: carrying the finished file -->
  <symbol id="biscuit-done" viewBox="0 0 64 64">
    <g>
      <ellipse cx="13.5" cy="31" rx="7.5" ry="12.5" fill="#C97F1E"/>
      <ellipse cx="50.5" cy="31" rx="7.5" ry="12.5" fill="#C97F1E"/>
      <ellipse cx="32" cy="30" rx="20" ry="18.5" fill="url(#b-coat)"/>
      <ellipse cx="32" cy="22" rx="7" ry="5.5" fill="#FFE0AE" opacity=".55"/>
      <ellipse cx="32" cy="39.5" rx="12" ry="8.5" fill="#FFE9C9"/>
      <ellipse cx="32" cy="35" rx="4.2" ry="3.2" fill="#2A211B"/>
      <circle cx="23.5" cy="27.5" r="2.9" fill="#2A211B"/>
      <circle cx="40.5" cy="27.5" r="2.9" fill="#2A211B"/>
      <circle cx="24.5" cy="26.5" r="1" fill="#fff"/>
      <circle cx="41.5" cy="26.5" r="1" fill="#fff"/>
      <!-- film card in mouth -->
      <rect x="17" y="44" width="30" height="13" rx="3" fill="#1C1917" stroke="#F0A93C" stroke-width="1.6"/>
      <g fill="#F0A93C">
        <rect x="20" y="47" width="2.6" height="2.6" rx=".7"/><rect x="20" y="51.5" width="2.6" height="2.6" rx=".7"/>
        <rect x="41.5" y="47" width="2.6" height="2.6" rx=".7"/><rect x="41.5" y="51.5" width="2.6" height="2.6" rx=".7"/>
      </g>
      <rect x="25.5" y="47" width="13" height="7" rx="1.6" fill="#F0A93C" opacity=".45"/>
    </g>
  </symbol>

  <!-- error: ears down, eyes low -->
  <symbol id="biscuit-sad" viewBox="0 0 64 64">
    <g>
      <ellipse cx="12" cy="42" rx="6.8" ry="13" fill="#C97F1E" transform="rotate(-9 12 42)"/>
      <ellipse cx="52" cy="42" rx="6.8" ry="13" fill="#C97F1E" transform="rotate(9 52 42)"/>
      <ellipse cx="32" cy="32" rx="20" ry="18.5" fill="url(#b-coat)"/>
      <ellipse cx="32" cy="24" rx="7" ry="5.5" fill="#FFE0AE" opacity=".55"/>
      <ellipse cx="32" cy="41.5" rx="12" ry="8.5" fill="#FFE9C9"/>
      <ellipse cx="32" cy="37" rx="4.2" ry="3.2" fill="#2A211B"/>
      <path d="M28.6 46.4a4.4 3 0 0 1 6.8 0" fill="none" stroke="#2A211B" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="23.5" cy="31" r="2.6" fill="#2A211B"/>
      <circle cx="40.5" cy="31" r="2.6" fill="#2A211B"/>
      <path d="M20 26.5c2-1.4 5-1.4 7 0M37 26.5c2-1.4 5-1.4 7 0" stroke="#C97F1E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </g>
  </symbol>


  <!-- happy: eyes closed in an arc, big smile, ears lifted -->
  <symbol id="biscuit-happy" viewBox="0 0 64 64">
    <g>
      <ellipse cx="13" cy="30" rx="7.5" ry="12.5" fill="#C97F1E" transform="rotate(-8 13 30)"/>
      <ellipse cx="51" cy="30" rx="7.5" ry="12.5" fill="#C97F1E" transform="rotate(8 51 30)"/>
      <ellipse cx="32" cy="32" rx="20" ry="18.5" fill="url(#b-coat)"/>
      <ellipse cx="32" cy="24" rx="7" ry="5.5" fill="#FFE0AE" opacity=".55"/>
      <ellipse cx="32" cy="41.5" rx="12" ry="8.5" fill="#FFE9C9"/>
      <ellipse cx="32" cy="37" rx="4.2" ry="3.2" fill="#2A211B"/>
      <path d="M27 44.5a5.5 4.5 0 0 0 10 0" fill="none" stroke="#2A211B" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M19.5 30.5c1.6-2.6 6.4-2.6 8 0M36.5 30.5c1.6-2.6 6.4-2.6 8 0"
            fill="none" stroke="#2A211B" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="17" cy="38" r="2.6" fill="#FF9E9E" opacity=".55"/>
      <circle cx="47" cy="38" r="2.6" fill="#FF9E9E" opacity=".55"/>
    </g>
  </symbol>

  <!-- excited: wide eyes, ears up, tongue peeking -->
  <symbol id="biscuit-excited" viewBox="0 0 64 64">
    <g>
      <ellipse cx="12.5" cy="27" rx="7" ry="12.5" fill="#C97F1E" transform="rotate(-16 12.5 27)"/>
      <ellipse cx="51.5" cy="27" rx="7" ry="12.5" fill="#C97F1E" transform="rotate(16 51.5 27)"/>
      <ellipse cx="32" cy="32" rx="20" ry="18.5" fill="url(#b-coat)"/>
      <ellipse cx="32" cy="24" rx="7" ry="5.5" fill="#FFE0AE" opacity=".55"/>
      <ellipse cx="32" cy="41.5" rx="12" ry="8.5" fill="#FFE9C9"/>
      <path d="M29.5 45.5h5a2.5 2.5 0 0 1-2.5 4.5 2.5 2.5 0 0 1-2.5-4.5Z" fill="#FF8A8A"/>
      <ellipse cx="32" cy="37" rx="4.2" ry="3.2" fill="#2A211B"/>
      <circle cx="23" cy="28.5" r="3.6" fill="#2A211B"/>
      <circle cx="41" cy="28.5" r="3.6" fill="#2A211B"/>
      <circle cx="24.4" cy="27.1" r="1.4" fill="#fff"/>
      <circle cx="42.4" cy="27.1" r="1.4" fill="#fff"/>
    </g>
  </symbol>

  <!-- paw print, used as a bullet / loading dot -->
  <symbol id="biscuit-paw" viewBox="0 0 64 64">
    <ellipse cx="32" cy="41" rx="13" ry="11" fill="currentColor"/>
    <ellipse cx="16" cy="26" rx="6" ry="7.5" fill="currentColor"/>
    <ellipse cx="26" cy="17" rx="6" ry="7.5" fill="currentColor"/>
    <ellipse cx="38" cy="17" rx="6" ry="7.5" fill="currentColor"/>
    <ellipse cx="48" cy="26" rx="6" ry="7.5" fill="currentColor"/>
  </symbol>
</svg>
