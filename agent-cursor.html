<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  /* The agent's cursor, live, over the window it is recording. Fetch's own cursor, the
     same one the export draws (ui/pointer.js): a near-black macOS arrow with a light
     edge carrying Biscuit's badge, named at a click. It never touches the Mac's pointer: this window is
     click-through, never focused and kept out of every capture (main.js). */
  html,body { margin:0; height:100%; background:transparent; overflow:hidden; }
  /* sizes in arrow heights, as BADGE and TAG in ui/pointer.js */
  :root { --h:26px; --gold:#F0A93C; --edge:#FBFAF8; --ink:#1A1714; }
  #c { position:fixed; left:0; top:0; will-change:transform; opacity:0;
       transition:opacity 160ms cubic-bezier(.2,.8,.2,1); }
  #c.on { opacity:1; }
  /* the path is inset by its stroke; pulled back so the tip is the hot spot */
  #arrow { position:absolute; left:calc(var(--h) * -0.046); top:calc(var(--h) * -0.046); width:calc(var(--h) * 0.72); height:calc(var(--h) * 1.1);
           transform-origin:0 0; overflow:visible;
           filter:drop-shadow(0 1.5px 2.5px rgba(0,0,0,.38)); }
  #arrow.press { animation:press 250ms cubic-bezier(.2,.8,.2,1); }
  @keyframes press { 28% { transform:scale(.84) } 100% { transform:scale(1) } }
  #badge { position:absolute; width:calc(var(--h) * 0.76); height:calc(var(--h) * 0.76);
           left:calc(var(--h) * (1.0 - 0.38)); top:calc(var(--h) * (1.02 - 0.38));
           border-radius:50%; z-index:2; box-shadow:0 2px 5px rgba(0,0,0,.35); }
  #tag { position:absolute; z-index:1; height:calc(var(--h) * 0.62); box-sizing:border-box;
         left:calc(var(--h) * (1.0 - 0.19)); top:calc(var(--h) * (1.02 - 0.31));
         padding:0 calc(var(--h) * 0.3) 0 calc(var(--h) * 0.66);   /* the text clears the badge */
         display:flex; align-items:center; border-radius:999px;
         background:var(--gold); border:1px solid var(--edge); color:var(--ink);
         font:700 calc(var(--h) * 0.4)/1 ui-rounded, -apple-system, system-ui, sans-serif;
         letter-spacing:.01em; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.28);
         opacity:0; transition:opacity 220ms cubic-bezier(.4,0,1,1); }
  #tag.on { opacity:1; transition:opacity 180ms cubic-bezier(.2,.8,.2,1); }
  #tag.left { left:auto; right:calc(var(--h) * -1.19); padding:0 calc(var(--h) * 0.66) 0 calc(var(--h) * 0.3); }
  .ripple { position:fixed; width:calc(var(--h) * 2.2); height:calc(var(--h) * 2.2); margin:calc(var(--h) * -1.1) 0 0 calc(var(--h) * -1.1);
            border-radius:50%; box-sizing:border-box; border:2px solid rgba(240,169,60,.85);
            background:rgba(240,169,60,.12); transform:scale(.3); opacity:1; pointer-events:none;
            animation:ripple 560ms cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes ripple { to { transform:scale(1); opacity:0 } }
  @media (prefers-reduced-motion:reduce) { #arrow.press, .ripple { animation:none } .ripple { display:none } }
</style></head>
<body>
<div id="c">
  <svg id="arrow" viewBox="0 0 12.6 19.1">
    <path d="M0 0 L0 15.2 L3.6 11.8 L6.1 17.4 L8.4 16.4 L6 10.9 L10.9 10.9 Z"
      fill="#0A0908" stroke="#FBFAF8" stroke-width="1.1" stroke-linejoin="round" transform="translate(.8 .8)"/>
  </svg>
  <div id="tag">Biscuit</div>
  <img id="badge" src="assets/mascot/badge.png" alt="">
</div>
<script>
  const { ipcRenderer } = require('electron')
  const c = document.getElementById('c'), arrow = document.getElementById('arrow'), tag = document.getElementById('tag')
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches
  // the export's travelling curve (ui/overlays.js MOVE) and glide lengths (ui/pointer.js MOVE)
  const ease = p => p <= 0 ? 0 : p >= 1 ? 1 : p * p * (3 - 2 * p)
  let at = null, anim = null, tagTimer = null, path = null
  const place = p => { c.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px)` }

  function land(p, click) {
    if (!click) return
    arrow.classList.remove('press'); void arrow.offsetWidth; arrow.classList.add('press')
    const r = document.createElement('div')
    r.className = 'ripple'; r.style.left = p.x + 'px'; r.style.top = p.y + 'px'
    document.body.appendChild(r)
    setTimeout(() => r.remove(), 600)
    clearTimeout(tagTimer)
    tagTimer = setTimeout(() => tag.classList.remove('on'), 700)
  }

  // A pointer call: glide there on the eased, slightly bowed path, then press on a click
  ipcRenderer.on('agent-cursor', (e, { x, y, click, glide }) => {
    const to = { x, y }
    // The window moved mid-glide: carry the whole path along so the glide and its
    // click still finish, rather than jumping and leaving the tag up
    if (!glide && path && at) {
      const dx = x - path.to.x, dy = y - path.to.y
      for (const q of [path.from, path.mid, path.to]) { q.x += dx; q.y += dy }
      return
    }
    cancelAnimationFrame(anim)
    // a new target cut short a glide to a click, which will not land now
    if (path && path.click && !click) { clearTimeout(tagTimer); tag.classList.remove('on') }
    path = null
    if (!at || !glide || still) {
      at = to; place(to); c.classList.add('on'); land(to, click); return
    }
    const from = at, dist = Math.hypot(to.x - from.x, to.y - from.y)
    if (dist < 0.5) { land(to, click); return }
    const diag = Math.hypot(innerWidth, innerHeight)
    const dur = 1000 * Math.min(0.8, Math.max(0.32, 0.32 + 0.9 * dist / diag))
    const bow = Math.min(0.08 * dist, 0.02 * diag)
    const nx = -(to.y - from.y) / dist, ny = (to.x - from.x) / dist, s = ny > 0 ? -1 : 1
    const mid = { x: (from.x + to.x) / 2 + s * nx * bow, y: (from.y + to.y) / 2 + s * ny * bow }
    if (click) {
      clearTimeout(tagTimer)
      // near the right edge the tag reads leftward, so it is never cut off
      tag.classList.toggle('left', to.x + tag.offsetWidth + 40 > innerWidth)
      tag.classList.add('on')
    }
    const t0 = performance.now(), P = path = { from: { ...from }, mid, to, click }
    const step = now => {
      const p = ease(Math.min(1, (now - t0) / dur))
      at = { x: (1 - p) * (1 - p) * P.from.x + 2 * (1 - p) * p * P.mid.x + p * p * P.to.x,
             y: (1 - p) * (1 - p) * P.from.y + 2 * (1 - p) * p * P.mid.y + p * p * P.to.y }
      place(at)
      if (p < 1) anim = requestAnimationFrame(step)
      else { path = null; at = { ...P.to }; land(at, click) }
    }
    anim = requestAnimationFrame(step)
  })
  ipcRenderer.on('agent-cursor-hide', () => c.classList.remove('on'))
</script>
</body></html>
