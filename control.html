<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Where this window may load anything from. It runs with node in it, and since the
     backdrop picker it now draws shows photographs served by Unsplash, remote strings
     reach this document for the first time. Pictures may come from this Mac or from
     images.unsplash.com and nowhere else; nothing here may open a connection, a frame
     or a plugin of its own. Scripts and styles are this app's own files, loaded off
     disk, and the inline handlers and style attributes they already use stay allowed:
     tightening those is a separate job, and a broken window helps nobody. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' file: data: blob: https://images.unsplash.com; media-src 'self' file: data: blob:; connect-src 'self' file: data: blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Fetch</title>
<link rel="stylesheet" href="./ui/tokens.css">
<link rel="stylesheet" href="./ui/components.css">
<link rel="stylesheet" href="./ui/dropdown.css">
<link rel="stylesheet" href="./ui/app.css">
<link rel="stylesheet" href="./ui/editor.css">
<link rel="stylesheet" href="./ui/settings.css">
</head>
<body>

<!-- draggable titlebar: traffic lights live at 18px, so content starts at 92 -->
<header id="titlebar">
  <div class="tb-brand">
    <img class="tb-mark" src="./assets/mascot/idle.png" alt="">
    <span class="tb-name">Fetch</span>
  </div>

  <nav class="seg" id="nav" role="tablist">
    <button role="tab" data-view="record" aria-selected="true">
      <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-record-fill"/></svg> Record</button>
    <button role="tab" data-view="library" aria-selected="false">
      <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-film-strip"/></svg> Library</button>
    <button role="tab" data-view="editor" aria-selected="false" disabled>
      <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-scissors"/></svg> Edit</button>
    <button role="tab" data-view="activity" aria-selected="false">
      <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-clock"/></svg> Activity
    </button>
  </nav>

  <div class="tb-right">
    <button class="btn btn-ghost btn-icon btn-sm" id="importBtn" data-tip="Import a video">
      <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-upload-simple"/></svg></button>
    <button class="btn btn-ghost btn-icon btn-sm" id="folderBtn" data-tip="Open the Fetch folder">
      <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-folder-open"/></svg></button>
    <button class="btn btn-ghost btn-icon btn-sm" id="gearBtn" data-tip="Settings">
      <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-gear"/></svg></button>
  </div>
</header>

<main id="stage">

  <!-- ═══════════════ RECORD (hero) ═══════════════ -->
  <section class="view" data-view="record">
    <div class="hero">
      <img class="biscuit hero-dog" id="biscuit" src="./assets/mascot/idle.png" alt="">

      <h1 class="hero-title">What are we recording <em class="accent">today</em>?</h1>
      <p class="hero-sub" id="biscuitLine">Screen, camera and mic. Set it up once and go.</p>

      <!-- The composer is the way in. Recording is what Fetch does, but "what are we
           recording today" is a question, and a button is not an answer to one. The
           direct path stays first in the chip row, because someone who just wants to
           press record should not have to type a sentence to get there. -->
      <form class="hero-ask" id="heroAsk">
        <div class="att-tray" id="heroAtt" hidden></div>
        <textarea id="heroInput" rows="1" autocomplete="off"
          placeholder="Record my Chrome window, then caption it"></textarea>
        <div class="hero-ask-foot">
          <button type="button" class="hero-engine" id="heroEngine"></button>
          <span class="hero-ask-grow"></span>
          <button type="submit" class="hero-send" id="heroSend" disabled>
            <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-arrow-right"/></svg></button>
        </div>
      </form>

      <div class="hero-chips" id="heroChips">
        <button class="chip chip-lg hero-chip hero-chip-go" id="setupBtn">
          <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-sliders-horizontal"/></svg>
          Set up a recording</button>
        <button class="chip chip-lg hero-chip" data-ask="What is on my screen right now? Name the apps.">
          <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-monitor"/></svg>
          What is on my screen?</button>
        <button class="chip chip-lg hero-chip" data-ask="Transcribe my most recent recording and tell me what I said.">
          <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-closed-captioning"/></svg>
          Transcribe my last take</button>
      </div>

      <!-- shown once a setup exists -->
      <div class="hero-ready" id="heroReady" hidden>
        <div class="ready-card" id="readyCard">
          <div class="ready-shot"><img id="sourceThumb" alt=""><div class="ready-empty">
            <svg class="icon-xl"><use href="./assets/icons/sprite.svg#i-monitor"/></svg></div></div>
          <div class="ready-info">
            <span class="caps">Recording</span>
            <span class="ready-name" id="sourceName">Entire screen</span>
            <div class="ready-chips" id="readyChips"></div>
          </div>
          <button class="btn btn-sm btn-ghost" id="editSetup">Change</button>
        </div>
        <button class="btn btn-record" id="start"><span class="dot"></span> Start recording</button>
        <p class="micro dimmer">⌥⇧⌘R to start or stop from anywhere</p>
      </div>
    </div>
  </section>

  <!-- ═══════════════ LIBRARY ═══════════════ -->
  <section class="view" data-view="library" hidden>
    <div class="lib-head">
      <h2>Library</h2>
      <span class="chip chip-static" id="libCount">0 clips</span>
      <div style="flex:1"></div>
      <button class="btn btn-sm" id="libName" hidden>
        <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-pencil-simple"/></svg> <span>Name recordings</span></button>
      <button class="btn btn-sm" id="libImport">
        <svg class="icon-sm"><use href="./assets/icons/sprite.svg#i-upload-simple"/></svg> Import</button>
    </div>
    <div id="libNamed" class="lib-named" hidden></div>
    <div id="libGrid" class="lib-grid"></div>
  </section>

  <!-- ═══════════════ EDITOR ═══════════════ -->
  <section class="view" data-view="editor" hidden>
    <div id="editorMount" class="empty">
      <img class="biscuit biscuit-lg" src="./assets/mascot/idle.png" alt="">
      <p>Pick a clip in the Library to start editing.</p>
    </div>
  </section>

  <!-- ═══════════════ SETTINGS ═══════════════ -->
  <!-- ══════════════════════════════════ ACTIVITY ══════════════════════════════════ -->
  <section class="view" data-view="activity" hidden>
    <div id="activityMount"></div>
  </section>

  <section class="view" data-view="settings" hidden>
    <div id="settingsMount"></div>
  </section>
</main>

<!-- ═══════════════ COUNTDOWN ═══════════════ -->
<div id="countdown" hidden><span id="countNum">3</span></div>

<div class="toasts" id="toasts"></div>

<script src="./ui/fmt.js"></script>
<script src="./ui/prefs.js"></script>
<script src="./ui/dropdown.js"></script>
<script src="./ui/setup.js"></script>
<script src="./ui/app.js"></script>
<script src="./ui/player.js"></script>
<script src="./ui/editor.js"></script>
<script src="./ui/onboarding.js"></script>
<script src="./ui/autosave.js"></script>
<script src="./ui/toast-guard.js"></script>
<script src="./ui/idle.js"></script>
<script src="./ui/settings.js"></script>
<script src="./ui/activity.js"></script>
<script src="./ui/tooltip.js"></script>
<script src="./ui/model-picker.js"></script>
<script src="./ui/chat.js"></script>
</body>
</html>
